defaults:
  - model: idf_hn
  - dataset: split_mnist
  - trainer: continual
  - experiment: main
  - _self_

# 全局配置
seed: 42
device: cuda
project_name: idf-hn
run_name: ${model.name}_${dataset.name}_${now:%Y%m%d_%H%M%S}

# Hydra 输出配置
hydra:
  run:
    dir: outputs/${run_name}
  sweep:
    dir: outputs/sweep
    subdir: ${hydra.job.num}
